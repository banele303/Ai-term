<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>
    <linearGradient id="violet-grad" x1="105" y1="15" x2="15" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="60" y1="40" x2="60" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bg-grad)" />
  <rect x="4" y="4" width="112" height="112" rx="28" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Tri-Facet Autonomous AI Teammates Emblem -->
  <!-- Top-Right Facet (Ops & Procurement) -->
  <path d="M60 22L92 40.5V64.5L60 46V22Z" fill="url(#cyan-grad)" fill-opacity="0.95" />

  <!-- Bottom-Right Facet (Comms & Social Marketing) -->
  <path d="M92 64.5L92 85L60 103.5V83L92 64.5Z" fill="url(#violet-grad)" fill-opacity="0.95" />

  <!-- Bottom-Left Facet (Quotes & WhatsApp Deals) -->
  <path d="M60 103.5L28 85V64.5L60 83V103.5Z" fill="url(#emerald-grad)" fill-opacity="0.95" />

  <!-- Top-Left Facet -->
  <path d="M28 64.5L28 40.5L60 22V46L28 64.5Z" fill="url(#cyan-grad)" fill-opacity="0.75" />

  <!-- Center Nexus Shield -->
  <path d="M60 46L92 64.5L60 83L28 64.5L60 46Z" fill="#09090b" stroke="url(#cyan-grad)" stroke-width="2" />

  <!-- Central Radiant Core -->
  <circle cx="60" cy="64.5" r="9" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="60" cy="64.5" r="4.5" fill="#ffffff" />

  <!-- Orbital Node Satellites -->
  <circle cx="60" cy="22" r="3.5" fill="#38bdf8" />
  <circle cx="92" cy="85" r="3.5" fill="#c084fc" />
  <circle cx="28" cy="85" r="3.5" fill="#34d399" />
</svg>
